version: '3.8'

services:
  # ───────────────────── 데이터베이스 (PostgreSQL) ─────────────────────
  postgres:
    image: postgres:16
    container_name: team_matching_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: team_matching
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_matching"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────── 백엔드 (Spring Boot) ─────────────────────
  backend:
    build: ./backend
    container_name: team_matching_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # application.yml의 localhost 대신 컨테이너 네트워크상의 'postgres'로 연결
      # (Spring Boot relaxed binding으로 yml 값 자동 오버라이드)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/team_matching
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    ports:
      - "8080:8080"

  # ───────────────────── 프론트엔드 (React + nginx) ─────────────────────
  frontend:
    build: ./frontend
    container_name: team_matching_frontend
    restart: always
    depends_on:
      - backend
    # CORS 설정(localhost:3000 허용)에 맞춰 호스트 3000 → 컨테이너 80 매핑
    ports:
      - "3000:80"

volumes:
  postgres_data:
